spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hilti_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: hilti_user
    password: hilti123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.example.com
    port: 587
    username: your-smtp-user
    password: your-smtp-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: hilti-secret-key-change-me
  expiration-ms: 86400000

cors:
  allowed-origins: http://localhost:5173